# Empty string = not confirmed on the robot yet
/**:
  ros__parameters:
    camera_id: head

    cameras:
      head:
        enabled: true
        image_topic: /zed/zed_node/left/image_rect_color
        stream_type: rectified  # raw or rectified
        camera_info_topic: /zed/zed_node/left/camera_info
        depth_topic: ""  # ZED depth_mode NONE
        frame_id: zed_left_camera_optical_frame

      left_wrist:  # not mounted
        enabled: false
        image_topic: ""
        stream_type: ""
        camera_info_topic: ""
        depth_topic: ""
        frame_id: ""

      right_wrist:  # not mounted
        enabled: false
        image_topic: ""
        stream_type: ""
        camera_info_topic: ""
        depth_topic: ""
        frame_id: ""
